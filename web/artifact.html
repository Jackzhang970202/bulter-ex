<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产物 · 知鉴 KnowLens</title>
<style>
  :root{--bg:#f7f8fa;--card:#fff;--border:#e4e7ec;--t1:#101828;--t2:#475467;--t3:#8a94a6;--brand:#2563eb}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--t1);
    font:14px/1.75 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:30px 20px 60px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .mark{width:32px;height:32px;border-radius:8px;background:var(--brand);color:#fff;
    display:grid;place-items:center;font-weight:700}
  h1{font-size:20px;margin:0;letter-spacing:-.01em}
  .actions{margin-left:auto;display:flex;gap:8px}
  .btn{border:1px solid var(--border);background:var(--card);color:var(--t2);
    border-radius:8px;padding:6px 12px;text-decoration:none;font-size:12px}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .meta{color:var(--t3);font-size:11.5px;margin-bottom:14px}
  .doc{background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:22px 26px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .doc pre{background:#f1f3f6;padding:10px;border-radius:8px;overflow:auto}
  .doc table{border-collapse:collapse;width:100%;font-size:12.5px}
  .doc th,.doc td{border:1px solid var(--border);padding:5px 8px;text-align:left}
  .empty{padding:40px;text-align:center;color:var(--t3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="mark">鉴</div>
    <h1 id="title">产物</h1>
    <div class="actions">
      <a class="btn" id="download" href="#">下载</a>
      <a class="btn primary" href="/">返回工作台</a>
    </div></div>
  <div class="meta" id="meta"></div>
  <div class="doc" id="doc"><div class="empty">加载中…</div></div>
</div>
<script src="/static/vendor/marked.min.js"></script>
<script>
  const id = location.pathname.split("/").filter(Boolean).pop();
  fetch(`/api/platform/artifacts/${encodeURIComponent(id)}`).then(async (r) => {
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
    return r.json();
  }).then((meta) => {
    document.getElementById("title").textContent = meta.name || "产物";
    document.getElementById("meta").textContent =
      `${meta.bytes || 0} 字节 · ${meta.created_at || ""}`;
    document.getElementById("download").href =
      `/api/platform/artifacts/${id}/download`;
    return fetch(`/api/platform/artifacts/${id}/download`).then((r) => r.text());
  }).then((text) => {
    document.getElementById("doc").innerHTML = marked.parse(text || "");
  }).catch((err) => {
    document.getElementById("doc").innerHTML =
      `<div class="empty">无法打开产物：${err.message || err}</div>`;
  });
</script>
</body>
</html>
